      #initial-loader {
        position: fixed; inset: 0;

    <script>
      /* Remove o pin/badge do Lovable assim que for injetado no DOM */
      (function () {
        function removeLovableBadge() {
          var badge = document.getElementById('lovable-badge') ||
                      document.querySelector('[id*="lovable-badge"]') ||
                      document.querySelector('a[href*="lovable.dev/projects"]') ||
                      document.querySelector('a[href*="lovable.dev"]');
          if (badge) {
            badge.remove();
          }
        }
        removeLovableBadge();
        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(function () {
            removeLovableBadge();
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <div id="initial-loader"><div class="spinner"></div></div>
    <script>
      // Remove o splash assim que o React renderizar
      (function () {
        var root = document.getElementById('root');
        var loader = document.getElementById('initial-loader');
        if (!root || !loader) return;
        var obs = new MutationObserver(function () {
          if (root.children.length > 0) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 200ms';
            setTimeout(function () { loader.remove(); }, 220);
            obs.disconnect();
          }
        });
        obs.observe(root, { childList: true });
      })();
    </script>
